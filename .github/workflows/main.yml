name: CI
on:
   push:
      branches:
         - '**'
env:
   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
   build:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
              node-version: 24.x

         - run: npm ci
         - run: npm run lint && npm run build
